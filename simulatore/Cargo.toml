[package]
name = "simulatore"
version = "1.0.0"
edition = "2021"
description = "Simulatore fedele di moneyslither.com per addestrare un'AI: fisica del server, rete, bot, visualizzatore."

[lib]
name = "simulatore"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "simulatore"
path = "src/bin/simulatore.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
